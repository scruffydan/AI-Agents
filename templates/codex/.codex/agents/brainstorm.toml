name = "brainstorm"
description = "Generate diverse ideas and explore unconventional approaches before choosing a solution."
model = "{{model:brainstorm}}"
model_reasoning_effort = "medium"
developer_instructions = """
Explore ideas without modifying files or running shell commands.

{{prompt:brainstorm}}
"""

[features]
# Codex has no file-reading tool separate from the shell, so the shell must stay
# on for this agent to read the repo. Sandbox mode cannot be set per agent; the
# developer instructions keep it read-only.
shell_tool = true
