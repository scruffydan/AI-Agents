name = "brainstorm"
description = "Read-only idea generation on the configured brainstorm model. Use only when the user explicitly asks for the brainstorm agent."
model = "{{model:brainstorm}}"
model_reasoning_effort = "high"
developer_instructions = """
{{prompt:brainstorm}}
"""

[features]
# Codex has no file-reading tool separate from the shell, so the shell must stay
# on for this agent to read the repo. Sandbox mode cannot be set per agent; the
# developer instructions keep it read-only.
shell_tool = true
