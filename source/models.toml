# Shared agent definitions select one of these model profiles.
# OpenCode values include their reasoning variant.
# Antigravity accepts only a model tier: inherit, flash, or pro. Its docs do not
# say which models flash and pro run, so agents inherit the session model.
# A missing *_work value falls back to the normal harness value.

[brainstorm]
opencode = "openai/gpt-6.2-astra#high"
opencode_work = "google-vertex/claude-opus-5-5#high"
claude = "claude-opus-5-5"
codex = "gpt-6.2-astra"
antigravity = "inherit"

[deep_review]
opencode = "openai/gpt-6.2-sol#high"
opencode_work = "google-vertex/claude-opus-5-5#high"
claude = "claude-opus-5-5"
codex = "gpt-6.2-sol"
antigravity = "inherit"

[docs_fetcher]
opencode = "openai/gpt-6.1-terra#low"
opencode_work = "google-vertex/claude-sonnet-5-5#high"
claude = "claude-sonnet-5-5"
codex = "gpt-6.1-terra"
antigravity = "inherit"

[git_commit]
opencode = "openai/gpt-6.1-terra#low"
opencode_work = "google-vertex/claude-sonnet-5-5#high"
claude = "claude-sonnet-5-5"
codex = "gpt-6.1-terra"
antigravity = "inherit"
